version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smartops-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartops-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/smartops
      - JWT_SECRET=smartops_super_secret_key_123!
    depends_on:
      - mongodb
    networks:
      - smartops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - smartops-network

volumes:
  mongodb_data:

networks:
  smartops-network:
    driver: bridge
